
services:
  sitrec:
    build: .
    ports:
      # host:container — the container now listens on 8080 (unprivileged, so it
      # can run as a non-root UID). Change the host side (left) freely.
      - '8080:8080'
    env_file:
      - .env
    volumes:
# We mount the videos as a volume to avoid having to include them in the docker image      -
      - ./sitrec-videos:/var/www/html/sitrec-videos
#      - ./sitrec-cache:/var/www/html/sitrec-cache
      - ../sitrec-terrain:/var/www/html/sitrec-terrain