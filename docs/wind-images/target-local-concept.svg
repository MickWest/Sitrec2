<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a7"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c33"/>
    </marker>
  </defs>

  <!-- ground reference line -->
  <line x1="40" y1="290" x2="720" y2="290" stroke="#bbb" stroke-dasharray="4 3"/>

  <!-- Camera platform (left) -->
  <g transform="translate(140,180)">
    <polygon points="-30,18 30,18 18,-12 -18,-12" fill="#fff" stroke="#0a7" stroke-width="2"/>
    <text x="0" y="42" text-anchor="middle" fill="#0a7" font-weight="600">Camera platform</text>
    <text x="0" y="58" text-anchor="middle" fill="#666">jet, ship, balloon…</text>
    <!-- Local wind arrow -->
    <line x1="-90" y1="-30" x2="-30" y2="-15" stroke="#0a7" stroke-width="3" marker-end="url(#arrowL)"/>
    <text x="-90" y="-40" text-anchor="middle" fill="#0a7" font-weight="600">Local Wind</text>
  </g>

  <!-- Target (right) -->
  <g transform="translate(560,150)">
    <circle r="18" fill="#fff" stroke="#c33" stroke-width="2"/>
    <text x="0" y="42" text-anchor="middle" fill="#c33" font-weight="600">Target</text>
    <text x="0" y="58" text-anchor="middle" fill="#666">tracked object</text>
    <!-- Target wind arrow -->
    <line x1="120" y1="-30" x2="30" y2="-10" stroke="#c33" stroke-width="3" marker-end="url(#arrowT)"/>
    <text x="120" y="-40" text-anchor="middle" fill="#c33" font-weight="600">Target Wind</text>
  </g>

  <!-- Line of sight -->
  <line x1="170" y1="180" x2="540" y2="148" stroke="#28f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="355" y="155" text-anchor="middle" fill="#28f" font-style="italic">line of sight</text>

  <!-- Caption -->
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#222">Two winds, two places</text>
  <text x="380" y="52" text-anchor="middle" fill="#444">Sitrec tracks <tspan fill="#0a7" font-weight="600">Local Wind</tspan> at the camera platform and <tspan fill="#c33" font-weight="600">Target Wind</tspan> at the tracked object.</text>
  <text x="380" y="70" text-anchor="middle" fill="#444">By default both come from the same source. Turn on <tspan font-style="italic">Separate Wind Sources</tspan> to feed them independently.</text>

  <!-- footer -->
  <text x="380" y="335" text-anchor="middle" fill="#888" font-size="11">Wind direction shown is the meteorological "from" — wind blows away from the arrow tail.</text>
</svg>
