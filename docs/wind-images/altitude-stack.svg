<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, system-ui, sans-serif" font-size="12">
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="700">Altitude — what the slider samples</text>

  <!-- ground -->
  <rect x="80" y="270" width="640" height="20" fill="#e9c697"/>
  <text x="380" y="284" text-anchor="middle" fill="#7a4">Surface</text>

  <!-- altitude scale on the left -->
  <g font-size="11" fill="#666">
    <line x1="80" y1="270" x2="80" y2="60" stroke="#bbb"/>
    <line x1="76" y1="270" x2="80" y2="270" stroke="#bbb"/>
    <line x1="76" y1="240" x2="80" y2="240" stroke="#bbb"/>
    <line x1="76" y1="200" x2="80" y2="200" stroke="#bbb"/>
    <line x1="76" y1="155" x2="80" y2="155" stroke="#bbb"/>
    <line x1="76" y1="105" x2="80" y2="105" stroke="#bbb"/>
    <line x1="76" y1="65" x2="80" y2="65" stroke="#bbb"/>
    <text x="74" y="274" text-anchor="end">0 ft</text>
    <text x="74" y="244" text-anchor="end">4 800 ft</text>
    <text x="74" y="204" text-anchor="end">18 300 ft</text>
    <text x="74" y="159" text-anchor="end">30 000 ft</text>
    <text x="74" y="109" text-anchor="end">38 600 ft</text>
    <text x="74" y="69"  text-anchor="end">53 200 ft</text>
  </g>

  <!-- pressure-level slabs -->
  <g>
    <rect x="120" y="265" width="540" height="6" fill="#9cf"/>
    <rect x="120" y="240" width="540" height="6" fill="#7bd"/>
    <rect x="120" y="200" width="540" height="6" fill="#6ad"/>
    <rect x="120" y="155" width="540" height="6" fill="#59c"/>
    <rect x="120" y="105" width="540" height="6" fill="#48b"/>
    <rect x="120" y="65"  width="540" height="6" fill="#37a"/>
    <text x="670" y="270" font-size="10" fill="#37a">10 m / surface</text>
    <text x="670" y="246" font-size="10" fill="#37a">850 hPa</text>
    <text x="670" y="206" font-size="10" fill="#37a">500 hPa</text>
    <text x="670" y="161" font-size="10" fill="#37a">300 hPa</text>
    <text x="670" y="111" font-size="10" fill="#37a">200 hPa</text>
    <text x="670" y="71"  font-size="10" fill="#37a">100 hPa</text>
  </g>

  <!-- slider knob -->
  <g>
    <line x1="380" y1="270" x2="380" y2="60" stroke="#c80" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="380" cy="200" r="8" fill="#c80" stroke="#fff" stroke-width="2"/>
    <text x="394" y="195" font-size="11" font-weight="700" fill="#c80">Altitude</text>
    <text x="394" y="218" font-size="10" fill="#444">between levels, Sitrec blends the two nearest</text>
  </g>

  <!-- caption -->
  <text x="380" y="50" text-anchor="middle" fill="#444">GFS publishes wind on pressure levels (six are shown here). Sitrec fetches the two levels on each side of your altitude.</text>
  <text x="380" y="307" text-anchor="middle" fill="#888" font-size="11">"Lock Altitude to" makes the slider follow the altitude of the camera or target.</text>
</svg>
