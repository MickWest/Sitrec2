<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, system-ui, sans-serif" font-size="12">
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="700">IDW grid construction (sounding sources)</text>

  <!-- Big globe rectangle (5° grid) -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="640" height="320" fill="#f6faff" stroke="#aac" stroke-width="1"/>
    <!-- 5° grid lines (sample some) -->
    <g stroke="#cdd" stroke-width="0.5">
      <line x1="80" y1="0" x2="80" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="320"/>
      <line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="320" y1="0" x2="320" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="480" y1="0" x2="480" y2="320"/>
      <line x1="560" y1="0" x2="560" y2="320"/>
      <line x1="0" y1="60" x2="640" y2="60"/>
      <line x1="0" y1="120" x2="640" y2="120"/>
      <line x1="0" y1="180" x2="640" y2="180"/>
      <line x1="0" y1="240" x2="640" y2="240"/>
    </g>

    <!-- coverage gradients around 4 samples (radial-ish) -->
    <defs>
      <radialGradient id="cov" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7bd" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#7bd" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="180" cy="120" r="90" fill="url(#cov)"/>
    <circle cx="220" cy="220" r="90" fill="url(#cov)"/>
    <circle cx="380" cy="160" r="90" fill="url(#cov)"/>
    <circle cx="500" cy="240" r="90" fill="url(#cov)"/>

    <!-- sample stars (sounding stations) -->
    <g fill="#c33">
      <circle cx="180" cy="120" r="4"/>
      <circle cx="220" cy="220" r="4"/>
      <circle cx="380" cy="160" r="4"/>
      <circle cx="500" cy="240" r="4"/>
    </g>
    <g font-size="10" fill="#922">
      <text x="186" y="115">UWYO 72293</text>
      <text x="226" y="215">UWYO 72469</text>
      <text x="386" y="155">UWYO 72476</text>
      <text x="506" y="235">IGRA2 USM…</text>
    </g>

    <!-- Cell highlighted: K=3 nearest, weights -->
    <rect x="280" y="180" width="40" height="40" fill="none" stroke="#222" stroke-width="2"/>
    <text x="300" y="174" text-anchor="middle" font-size="10" fill="#222" font-weight="700">target cell</text>

    <line x1="300" y1="200" x2="220" y2="220" stroke="#222" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="300" y1="200" x2="380" y2="160" stroke="#222" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="300" y1="200" x2="180" y2="120" stroke="#222" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="240" y="218" font-size="10" fill="#222">d₁</text>
    <text x="345" y="180" font-size="10" fill="#222">d₂</text>
    <text x="220" y="170" font-size="10" fill="#222">d₃</text>
  </g>

  <!-- Formulas -->
  <g transform="translate(60,400)" font-size="12" fill="#444">
    <text x="0" y="0" font-weight="700">Per cell:</text>
    <text x="60" y="0">u = Σ wᵢ uᵢ / Σ wᵢ,   v = Σ wᵢ vᵢ / Σ wᵢ,   wᵢ = 1 / dᵢ²</text>
    <text x="0" y="18" font-weight="700">Coverage:</text>
    <text x="60" y="18">cov = exp(-d_min / L),   L = 5° (≈ 550 km) — drives shader opacity falloff</text>
    <text x="0" y="36" font-weight="700">Grid:</text>
    <text x="60" y="36">72 × 37 (5°), only K = 3 nearest samples per cell — keeps result locally representative</text>
  </g>
</svg>
