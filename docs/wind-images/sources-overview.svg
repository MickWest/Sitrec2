<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="-apple-system, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="700">Wind sources</text>

  <!-- Atmospheric sources (left column) -->
  <rect x="30" y="44" width="210" height="236" rx="10" fill="#f6f6f6" stroke="#888" stroke-dasharray="4 3"/>
  <text x="135" y="62" text-anchor="middle" font-weight="700" fill="#444">Atmospheric sources</text>
  <g font-size="12">
    <rect x="40" y="70" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="83" font-weight="600">GFS (NOAA)</text>
    <text x="50" y="96" font-size="10" fill="#666">global forecast model</text>

    <rect x="40" y="104" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="117" font-weight="600">UWYO Soundings</text>
    <text x="50" y="130" font-size="10" fill="#666">Univ. of Wyoming radiosondes</text>

    <rect x="40" y="138" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="151" font-weight="600">IGRA2 Soundings</text>
    <text x="50" y="164" font-size="10" fill="#666">NOAA NCEI archive</text>

    <rect x="40" y="172" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="185" font-weight="600">Manual Soundings</text>
    <text x="50" y="198" font-size="10" fill="#666">every loaded sounding</text>

    <rect x="40" y="206" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="219" font-weight="600">open-meteo</text>
    <text x="50" y="232" font-size="10" fill="#666">per-point API</text>

    <rect x="40" y="240" width="190" height="31" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="253" font-weight="600">Track: &lt;name&gt;</text>
    <text x="50" y="266" font-size="10" fill="#666">a sounding track, used alone</text>
  </g>

  <!-- Sources that set the wind values directly (left column) -->
  <g font-size="12">
    <rect x="40" y="294" width="190" height="38" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="310" font-weight="600">Track: &lt;name&gt;</text>
    <text x="50" y="324" font-size="10" fill="#666">telemetry with wind columns</text>

    <rect x="40" y="342" width="190" height="38" rx="6" fill="#fff" stroke="#888"/>
    <text x="50" y="358" font-weight="600">Manual</text>
    <text x="50" y="372" font-size="10" fill="#666">values typed into the sliders</text>
  </g>

  <!-- Wind field box -->
  <rect x="330" y="66" width="170" height="80" rx="10" fill="#eaf3ff" stroke="#28f" stroke-width="2"/>
  <text x="415" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#28f">Wind field</text>
  <text x="415" y="114" text-anchor="middle" fill="#444">1° (GFS) or 5° global grid</text>
  <text x="415" y="130" text-anchor="middle" fill="#666" font-size="11">read by the lines and arrows</text>

  <!-- Display (right column) -->
  <g font-size="12">
    <rect x="600" y="52" width="160" height="44" rx="6" fill="#fff7e0" stroke="#c80"/>
    <text x="680" y="70" text-anchor="middle" font-weight="600" fill="#c80">Streamlines</text>
    <text x="680" y="86" text-anchor="middle" font-size="10" fill="#666">animated flow mesh</text>

    <rect x="600" y="116" width="160" height="44" rx="6" fill="#fff7e0" stroke="#c80"/>
    <text x="680" y="134" text-anchor="middle" font-weight="600" fill="#c80">Wind Arrows</text>
    <text x="680" y="150" text-anchor="middle" font-size="10" fill="#666">screen-grid overlay</text>
  </g>

  <!-- Target and Local Wind -->
  <rect x="375" y="296" width="170" height="60" rx="10" fill="#fff7e0" stroke="#c80" stroke-width="2"/>
  <text x="460" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#c80">Target / Local Wind</text>
  <text x="460" y="340" text-anchor="middle" fill="#666" font-size="11">the four sliders</text>

  <!-- Flows -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <line x1="240" y1="106" x2="330" y2="106"/>
    <line x1="240" y1="240" x2="375" y2="312"/>
    <line x1="230" y1="313" x2="375" y2="326"/>
    <line x1="230" y1="361" x2="375" y2="340"/>
    <line x1="460" y1="296" x2="460" y2="146"/>
    <line x1="230" y1="303" x2="345" y2="146"/>
    <line x1="500" y1="96" x2="600" y2="76"/>
    <line x1="500" y1="118" x2="600" y2="136"/>
  </g>

  <!-- Flow labels -->
  <g font-size="10" fill="#444">
    <text x="285" y="99" text-anchor="middle">at Altitude (ft)</text>
    <text x="300" y="252">on each load, at the</text>
    <text x="300" y="265">altitude of each track</text>
    <text x="296" y="312" text-anchor="middle">every frame</text>
    <text x="324" y="190">one track row</text>
    <text x="324" y="203">fills the field</text>
    <text x="471" y="207">Manual: the Target Wind</text>
    <text x="471" y="220">value fills the field</text>
  </g>
</svg>
