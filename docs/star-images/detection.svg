<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="-apple-system, system-ui, sans-serif" font-size="12">
  <text x="410" y="24" text-anchor="middle" font-size="16" font-weight="700">Stage 1 — finding point sources in one frame</text>

  <defs>
    <marker id="d-arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#456"/>
    </marker>
  </defs>

  <!-- Panel 1: tiled background -->
  <g transform="translate(24,52)">
    <text x="115" y="0" text-anchor="middle" font-weight="700" fill="#345">1. Local sky level</text>
    <rect x="0" y="12" width="230" height="150" fill="#101820"/>
    <!-- uneven glow -->
    <defs>
      <radialGradient id="glow" cx="72%" cy="30%" r="62%">
        <stop offset="0%" stop-color="#48606e" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#48606e" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="0" y="12" width="230" height="150" fill="url(#glow)"/>
    <!-- tile mesh -->
    <g stroke="#7ae" stroke-width="0.7" opacity="0.75">
      <line x1="57.5" y1="12" x2="57.5" y2="162"/>
      <line x1="115" y1="12" x2="115" y2="162"/>
      <line x1="172.5" y1="12" x2="172.5" y2="162"/>
      <line x1="0" y1="62" x2="230" y2="62"/>
      <line x1="0" y1="112" x2="230" y2="112"/>
    </g>
    <!-- stars -->
    <g fill="#fff">
      <circle cx="40" cy="45" r="2.2"/><circle cx="95" cy="90" r="1.6"/>
      <circle cx="150" cy="40" r="3"/><circle cx="185" cy="120" r="1.8"/>
      <circle cx="60" cy="135" r="1.4"/><circle cx="205" cy="70" r="2.4"/>
    </g>
    <text x="115" y="182" text-anchor="middle" fill="#456">sigma-clipped median per tile,</text>
    <text x="115" y="197" text-anchor="middle" fill="#456">interpolated between tile centres</text>
    <text x="115" y="215" text-anchor="middle" fill="#789" font-size="11">clipping stops a bright source</text>
    <text x="115" y="229" text-anchor="middle" fill="#789" font-size="11">raising its own tile's floor</text>
  </g>

  <line x1="266" y1="140" x2="292" y2="140" stroke="#456" stroke-width="1.5" marker-end="url(#d-arr)"/>

  <!-- Panel 2: threshold -->
  <g transform="translate(300,52)">
    <text x="115" y="0" text-anchor="middle" font-weight="700" fill="#345">2. Threshold</text>
    <rect x="0" y="12" width="230" height="150" fill="#fbfcfe" stroke="#bbc"/>
    <!-- profile -->
    <path d="M10 130 Q40 128 60 126 T110 122 T160 118 T220 114" stroke="#89a" stroke-width="1.5" fill="none"/>
    <path d="M10 108 Q40 106 60 104 T110 100 T160 96 T220 92" stroke="#e26" stroke-width="1.3" fill="none" stroke-dasharray="5 3"/>
    <!-- peaks -->
    <path d="M46 126 L52 40 L58 125" stroke="#28a" stroke-width="1.6" fill="none"/>
    <path d="M118 121 L124 62 L130 120" stroke="#28a" stroke-width="1.6" fill="none"/>
    <path d="M180 117 L186 110 L192 116" stroke="#28a" stroke-width="1.6" fill="none"/>
    <text x="150" y="88" fill="#e26" font-size="11">sky + N·σ</text>
    <text x="150" y="140" fill="#89a" font-size="11">sky level</text>
    <text x="196" y="104" fill="#a55" font-size="10">too faint</text>
    <text x="115" y="182" text-anchor="middle" fill="#456">keep pixels above sky + threshold·σ</text>
    <text x="115" y="200" text-anchor="middle" fill="#789" font-size="11">detected on a blurred copy (matched</text>
    <text x="115" y="214" text-anchor="middle" fill="#789" font-size="11">filter), measured on the raw one</text>
  </g>

  <line x1="542" y1="140" x2="568" y2="140" stroke="#456" stroke-width="1.5" marker-end="url(#d-arr)"/>

  <!-- Panel 3: blobs and rejection -->
  <g transform="translate(576,52)">
    <text x="115" y="0" text-anchor="middle" font-weight="700" fill="#345">3. Blobs, then judge</text>
    <rect x="0" y="12" width="230" height="150" fill="#fbfcfe" stroke="#bbc"/>
    <circle cx="55" cy="55" r="9" fill="none" stroke="#2a2" stroke-width="1.8"/>
    <circle cx="55" cy="55" r="3" fill="#333"/>
    <text x="70" y="52" fill="#2a2" font-size="10">kept</text>

    <ellipse cx="150" cy="52" rx="26" ry="6" fill="none" stroke="#d33" stroke-width="1.6"/>
    <text x="150" y="76" text-anchor="middle" fill="#d33" font-size="10">too elongated</text>

    <circle cx="42" cy="120" r="2.5" fill="none" stroke="#d33" stroke-width="1.4"/>
    <text x="56" y="123" fill="#d33" font-size="10">too small</text>

    <circle cx="176" cy="118" r="16" fill="none" stroke="#d33" stroke-width="1.6"/>
    <text x="176" y="146" text-anchor="middle" fill="#d33" font-size="10">too large</text>

    <text x="115" y="182" text-anchor="middle" fill="#456">flood-fill connected pixels, split</text>
    <text x="115" y="197" text-anchor="middle" fill="#456">touching pairs at the saddle</text>
    <text x="115" y="215" text-anchor="middle" fill="#789" font-size="11">every rejection is counted and</text>
    <text x="115" y="229" text-anchor="middle" fill="#789" font-size="11">reported, never silently dropped</text>
  </g>

  <g transform="translate(24,336)">
    <rect width="782" height="72" rx="6" fill="#f7f7f9" stroke="#bbc"/>
    <text x="16" y="22" font-weight="700" fill="#345">Why the sky level is measured per tile rather than once per frame</text>
    <text x="16" y="41" fill="#456">Night-vision and long-exposure footage is rarely evenly lit — airglow, light pollution and vignetting all tilt the background across the frame.</text>
    <text x="16" y="58" fill="#456">One global threshold either loses the faint stars in the dark corner or floods the bright one with false detections.</text>
  </g>
</svg>
