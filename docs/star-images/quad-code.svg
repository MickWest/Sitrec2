<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" font-family="-apple-system, system-ui, sans-serif" font-size="12">
  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="700">Identifying the field — the four-star "quad code"</text>
  <text x="420" y="43" text-anchor="middle" fill="#789">The same scheme astrometry.net uses. It answers "which stars are these?" without being told where the camera was pointing.</text>

  <defs>
    <marker id="q-arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#456"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <g transform="translate(24,66)">
    <text x="115" y="0" text-anchor="middle" font-weight="700" fill="#345">1. Pick four stars</text>
    <rect x="0" y="10" width="230" height="180" fill="#101820" stroke="#456"/>
    <circle cx="52" cy="140" r="4" fill="#fff"/>
    <circle cx="184" cy="52" r="4" fill="#fff"/>
    <circle cx="96" cy="82" r="3" fill="#fff"/>
    <circle cx="140" cy="126" r="3" fill="#fff"/>
    <g fill="#8ad" font-size="11">
      <text x="40" y="158">A</text><text x="192" y="46">B</text>
      <text x="84" y="76">C</text><text x="148" y="140">D</text>
    </g>
    <line x1="52" y1="140" x2="184" y2="52" stroke="#8ad" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="115" y="210" text-anchor="middle" fill="#456">A and B are the most</text>
    <text x="115" y="225" text-anchor="middle" fill="#456">widely separated pair.</text>
  </g>

  <line x1="266" y1="150" x2="292" y2="150" stroke="#456" stroke-width="1.5" marker-end="url(#q-arr)"/>

  <!-- step 2 -->
  <g transform="translate(300,66)">
    <text x="115" y="0" text-anchor="middle" font-weight="700" fill="#345">2. Rescale onto A→(0,0), B→(1,1)</text>
    <rect x="0" y="10" width="230" height="180" fill="#fbfcfe" stroke="#bbc"/>
    <!-- unit square -->
    <rect x="45" y="35" width="130" height="130" fill="#eef4fb" stroke="#8ad"/>
    <!-- circle with diameter AB -->
    <circle cx="110" cy="100" r="65" fill="none" stroke="#c9a465" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="45" cy="165" r="4" fill="#28a"/>
    <circle cx="175" cy="35" r="4" fill="#28a"/>
    <circle cx="88" cy="83" r="3" fill="#e26"/>
    <circle cx="132" cy="128" r="3" fill="#e26"/>
    <g font-size="11" fill="#456">
      <text x="28" y="180">A(0,0)</text><text x="160" y="30">B(1,1)</text>
      <text x="62" y="80">C</text><text x="140" y="132">D</text>
    </g>
    <text x="115" y="210" text-anchor="middle" fill="#456">The code is just C and D's</text>
    <text x="115" y="225" text-anchor="middle" fill="#456">positions in that square.</text>
  </g>

  <line x1="542" y1="150" x2="568" y2="150" stroke="#456" stroke-width="1.5" marker-end="url(#q-arr)"/>

  <!-- step 3 -->
  <g transform="translate(576,66)">
    <text x="120" y="0" text-anchor="middle" font-weight="700" fill="#345">3. Look it up</text>
    <rect x="0" y="10" width="240" height="180" fill="#fbfcfe" stroke="#bbc"/>
    <text x="16" y="36" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#456">code = (0.33, 0.63, 0.67, 0.28)</text>
    <line x1="16" y1="48" x2="224" y2="48" stroke="#ccd"/>
    <text x="16" y="70" font-size="11" fill="#789">catalog quads within tolerance:</text>
    <text x="16" y="90" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#28a">HIP 54061 · 53910 · 58001 · 59774</text>
    <text x="16" y="112" font-size="11" fill="#789">confirm by projecting the whole</text>
    <text x="16" y="127" font-size="11" fill="#789">field through the implied pose,</text>
    <text x="16" y="142" font-size="11" fill="#789">then count how many more stars land</text>
    <text x="16" y="157" font-size="11" fill="#789">where the catalog says they should</text>
    <text x="16" y="178" font-size="11" font-weight="700" fill="#2a2">72 of 231 matched → accepted</text>
    <text x="120" y="210" text-anchor="middle" fill="#456">One quad proposes; the rest</text>
    <text x="120" y="225" text-anchor="middle" fill="#456">of the field votes.</text>
  </g>

  <g transform="translate(24,318)">
    <rect width="792" height="118" rx="6" fill="#f7f7f9" stroke="#bbc"/>
    <text x="16" y="24" font-weight="700" fill="#345">Why a four-star shape, rather than matching star positions directly</text>
    <text x="16" y="45" fill="#456">The code does not change with where the camera pointed, how it was rolled, or how much sky the lens covers.</text>
    <text x="16" y="62" fill="#456">Rotating or zooming the picture moves every star, but leaves C and D in the same place relative to A and B.</text>
    <text x="16" y="86" fill="#456">Quads whose inner two stars fall outside the dashed circle are thrown away: outside it, which pair counts as</text>
    <text x="16" y="103" fill="#456">"most separated" can flip under a pixel of noise, and a code that flips is worse than no code at all.</text>
  </g>
</svg>
