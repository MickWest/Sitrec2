<text x="380.0" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">β is one signed number for the whole clip, taken as the median of the per-frame ratios so that a few</text>
<text x="380.0" y="498.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">independent spikes cannot set it. A frame matches when the candidate&#x27;s acceleration lands within half</text>
<text x="380.0" y="514.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">of β × the platform&#x27;s — as a vector, so its direction has to turn with it. A steady turn holds its size</text>
<text x="380.0" y="530.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">and changes only direction, so comparing sizes alone would pass the lower row at every instant.</text>
<text x="380.0" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">The share is the fraction of assessed time that matches — a count of frames, not a variance explained or a probability.</text>
