<text x="14.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="start" style="">Each panel is a short part of a 300 s track, at its own scale. g is acceleration in units of 9.81 m/s².</text>
<text x="14.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="start" style="">Outside the part drawn, the target flies straight and level at constant speed, or hovers.</text>
