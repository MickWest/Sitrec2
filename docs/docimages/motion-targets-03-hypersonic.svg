<svg xmlns="http://www.w3.org/2000/svg" width="760" height="706" viewBox="0 0 760 706" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Extreme set: hypersonic vehicles</title>
<desc>Four panels: a straight level track, a level track with a 5 degree descent, a 10 degree level turn, and a 10 degree heading change during a 5 degree descent. Speed is constant in all four.</desc>
<rect width="760" height="706" fill="#FFFFFF"/>
<defs></defs>
<text x="380.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17202A" text-anchor="middle" style="">Extreme set: hypersonic vehicles</text>
<text x="380.0" y="45.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="">Test limits in the generator: 10,593 m/s (38,136 km/h) and 52.0 g. They are not measured vehicle performance.</text>
<text x="380.0" y="61.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="">At this speed, a turn that peaks at 52 g takes 6.8 s to change heading by only 10°.</text>
