<svg xmlns="http://www.w3.org/2000/svg" width="860" height="475" viewBox="0 0 860 475" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="475" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Sun ghost in a catadioptric (mirror) telescope</text>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11.0" refY="6.5" orient="auto"><path d="M0,0 L13,6.5 L0,13 z" fill="#e8920c"/></marker>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.5" refY="5.0" orient="auto"><path d="M0,0 L10,5.0 L0,10 z" fill="#2c3e50"/></marker>
  </defs>

  <!-- telescope tube -->
  <rect x="250" y="95" width="592" height="250" rx="10" fill="#f4f6f8" stroke="#9fb0bd" stroke-width="1.5"/>

  <!-- scene light: in through the window, primary, secondary, back through the hole in the primary, sensor -->
  <polyline points="205,150 737.4,150 435,203 806,220" fill="none" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ab)"/>
  <polyline points="205,290 737.4,290 435,237 806,220" fill="none" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="590" y1="150" x2="602" y2="150" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ab)"/>
  <line x1="590" y1="290" x2="602" y2="290" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="300" y="139" font-size="13" fill="#2c3e50" font-weight="600">scene light → focused image on the sensor</text>

  <!-- flat window. The top edge leans back toward the telescope -->
  <line x1="262" y1="108" x2="246" y2="332" stroke="#16a085" stroke-width="7" stroke-linecap="round"/>
  <text x="236" y="322" text-anchor="end" font-size="14" fill="#16a085" font-weight="600">flat window (lean θ)</text>

  <!-- primary mirror: concave side faces the incoming light, with a central hole -->
  <path d="M 722 110 Q 744.3 157 747.4 204" fill="none" stroke="#34495e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 722 330 Q 744.3 283 747.4 236" fill="none" stroke="#34495e" stroke-width="8" stroke-linecap="round"/>
  <text x="725" y="86" text-anchor="middle" font-size="14" fill="#34495e" font-weight="600">primary mirror</text>

  <!-- secondary mirror: convex, sends the light back toward the primary -->
  <path d="M 430 197 Q 446 220 430 243" fill="none" stroke="#34495e" stroke-width="6" stroke-linecap="round"/>
  <text x="432" y="181" text-anchor="middle" font-size="13" fill="#34495e" font-weight="600">secondary mirror</text>

  <!-- sensor, behind the hole in the primary -->
  <rect x="806" y="198" width="9" height="44" fill="#2c3e50"/>
  <text x="810" y="188" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="600">sensor</text>

  <!-- Sun, far off-axis. The ray stops at the window: the figure draws no path after it -->
  <circle cx="95" cy="78" r="22" fill="#f5b301"/>
  <g stroke="#f5b301" stroke-width="3" stroke-linecap="round"><line x1="125" y1="78" x2="137" y2="78"/><line x1="116.2" y1="99.2" x2="124.7" y2="107.7"/><line x1="95" y1="108" x2="95" y2="120"/><line x1="73.8" y1="99.2" x2="65.3" y2="107.7"/><line x1="65" y1="78" x2="53" y2="78"/><line x1="73.8" y1="56.8" x2="65.3" y2="48.3"/><line x1="95" y1="48" x2="95" y2="36"/><line x1="116.2" y1="56.8" x2="124.7" y2="48.3"/></g>
  <text x="95" y="150" text-anchor="middle" font-size="15" fill="#b07a00" font-weight="700">Sun</text>
  <text x="95" y="168" text-anchor="middle" font-size="12" fill="#777">far off-axis</text>
  <line x1="124" y1="95" x2="255" y2="134" stroke="#e8920c" stroke-width="3" marker-end="url(#ah)"/>
  <text x="146" y="90" font-size="13" fill="#c97a00" font-weight="600">incoming sunlight</text>

  <!-- the reflection is the model's rule, so it is a bracket, not a ray -->
  <path d="M 256 350 L 256 358 L 800 358 L 800 350" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="256" y="379" font-size="13" fill="#c0392b" font-weight="700">reflected fraction: the model's rule, not a light path</text>
  <text x="256" y="397" font-size="12" fill="#c0392b">A ghost takes an even number of extra reflections on the way to the sensor.</text>
  <text x="256" y="413" font-size="12" fill="#c0392b">The model traces no path for this light. It applies one reflection in the</text>
  <text x="256" y="429" font-size="12" fill="#c0392b">window plane, then a magnification (Sections 4 and 5).</text>

  <!-- what the sensor records -->
  <line x1="810" y1="242" x2="810" y2="372" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="740" y="372" width="104" height="66" fill="#2c3e50"/>
  <defs><radialGradient id="disc"><stop offset="0.65" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>
  <circle cx="775" cy="400" r="17" fill="url(#disc)"/>
  <text x="846" y="456" text-anchor="end" font-size="12" fill="#c0392b" font-weight="700">ghost: a round, out-of-focus disc</text>
</svg>
