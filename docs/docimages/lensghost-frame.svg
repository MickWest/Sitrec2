<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Gnomonic projection — where the Sun would image (side view)</text>
  <defs>
    <marker id="aa" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11.0" refY="6.5" orient="auto"><path d="M0,0 L13,6.5 L0,13 z" fill="#e8920c"/></marker>
    <marker id="ab" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.3" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2980b9"/></marker>
  </defs>

  <!-- camera centre at (110,480), image plane at x=320 (fpx_drawn = 210), boresight y=480 -->
  <!-- image plane -->
  <line x1="320" y1="120" x2="320" y2="560" stroke="#9fb0bd" stroke-width="2"/>
  <text x="332" y="310" font-size="13" fill="#6b7a80">image plane (sensor)</text>

  <!-- FOV cone (narrow), frame half-height 37px (±10° half-FOV) -->
  <line x1="110" y1="480" x2="320" y2="443" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="110" y1="480" x2="320" y2="517" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="443" x2="320" y2="517" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
  <text x="334" y="458" font-size="13" fill="#2c3e50" font-weight="700">frame (FOV)</text>

  <!-- boresight -->
  <line x1="110" y1="480" x2="640" y2="480" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ab)"/>
  <circle cx="320" cy="480" r="4" fill="#2980b9"/>
  <text x="500" y="471" font-size="14" fill="#2980b9" font-weight="700">boresight (heading)</text>
  <text x="334" y="500" font-size="12" fill="#2980b9">frame centre</text>

  <!-- camera centre -->
  <circle cx="110" cy="480" r="6" fill="#1a1a1a"/>
  <text x="110" y="505" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">camera centre</text>

  <!-- example Sun ray at 58 deg above axis: crosses image plane at y = 480 - 210*tan58 = 144 -->
  <line x1="110" y1="480" x2="343" y2="106" stroke="#e8920c" stroke-width="3" marker-end="url(#aa)"/>
  <!-- Sun symbol -->
  <circle cx="362" cy="92" r="17" fill="#f5b301"/>
  <g stroke="#f5b301" stroke-width="2.5" stroke-linecap="round"><line x1="386" y1="92" x2="395" y2="92"/><line x1="379" y1="109" x2="385.3" y2="115.3"/><line x1="362" y1="116" x2="362" y2="125"/><line x1="345" y1="109" x2="338.7" y2="115.3"/><line x1="338" y1="92" x2="329" y2="92"/><line x1="345" y1="75" x2="338.7" y2="68.7"/><line x1="362" y1="68" x2="362" y2="59"/><line x1="379" y1="75" x2="385.3" y2="68.7"/></g>
  <text x="404" y="97" font-size="15" fill="#b07a00" font-weight="700">Sun</text>

  <!-- angle alpha arc at camera centre -->
  <path d="M 190 480 A 80 80 0 0 0 152.4 412.2" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="196" y="432" font-size="15" fill="#c0392b" font-weight="700">off-axis angle α</text>

  <!-- sun image point on plane, above the frame -->
  <circle cx="320" cy="144" r="5" fill="#e8920c"/>
  <line x1="320" y1="144" x2="470" y2="144" stroke="#e8920c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="476" y="140" font-size="13" fill="#b07a00" font-weight="700">sunY = cy − fpx·tan α</text>
  <text x="476" y="158" font-size="12" fill="#b07a00">(far off the top of the frame)</text>

  <!-- fpx bracket -->
  <line x1="110" y1="575" x2="320" y2="575" stroke="#555" stroke-width="1"/>
  <line x1="110" y1="570" x2="110" y2="580" stroke="#555" stroke-width="1"/>
  <line x1="320" y1="570" x2="320" y2="580" stroke="#555" stroke-width="1"/>
  <text x="215" y="592" text-anchor="middle" font-size="13" fill="#555">fpx = origH / (2·tan(vFOV/2))</text>
</svg>
