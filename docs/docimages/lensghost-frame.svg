<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Gnomonic projection — where the Sun would image (side view)</text>
  <defs>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8920c"/></marker>
  </defs>

  <!-- optical centre, image plane at x=320 (fpx_drawn = 210), boresight y=480 -->
  <!-- image plane -->
  <line x1="320" y1="120" x2="320" y2="560" stroke="#9fb0bd" stroke-width="2"/>
  <text x="332" y="138" font-size="13" fill="#7f8c8d">image plane (sensor)</text>

  <!-- FOV cone (narrow), frame half-height 37px (±10° half-FOV) -->
  <line x1="110" y1="480" x2="320" y2="443" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="110" y1="480" x2="320" y2="517" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="320" y1="443" x2="320" y2="517" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
  <text x="334" y="470" font-size="13" fill="#2c3e50" font-weight="700">frame</text>
  <text x="334" y="487" font-size="13" fill="#2c3e50" font-weight="700">(FOV)</text>

  <!-- boresight -->
  <line x1="110" y1="480" x2="600" y2="480" stroke="#2980b9" stroke-width="2.5" stroke-dasharray="2 0"/>
  <circle cx="320" cy="480" r="4" fill="#2980b9"/>
  <text x="500" y="473" font-size="14" fill="#2980b9" font-weight="700">boresight (heading)</text>
  <text x="320" y="540" text-anchor="middle" font-size="12" fill="#2980b9">frame centre</text>

  <!-- optical centre -->
  <circle cx="110" cy="480" r="6" fill="#1a1a1a"/>
  <text x="110" y="505" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">optical centre</text>

  <!-- sun ray at TRUE 58 deg above axis: crosses image plane at y = 480 - 210*tan58 = 144 -->
  <line x1="110" y1="480" x2="343" y2="106" stroke="#e8920c" stroke-width="3" marker-end="url(#aa)"/>
  <!-- Sun symbol -->
  <circle cx="360" cy="95" r="17" fill="#f5b301"/>
  <g stroke="#f5b301" stroke-width="2.5" stroke-linecap="round">
    <line x1="360" y1="71" x2="360" y2="62"/><line x1="384" y1="95" x2="393" y2="95"/>
    <line x1="343" y1="78" x2="337" y2="72"/><line x1="377" y1="78" x2="383" y2="72"/>
  </g>
  <text x="395" y="100" font-size="15" fill="#c98a00" font-weight="700">Sun</text>

  <!-- angle alpha arc at optical centre -->
  <path d="M 190 480 A 80 80 0 0 0 152.6 412" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="205" y="442" font-size="15" fill="#c0392b" font-weight="700">α ≈ 58°</text>

  <!-- sun image point on plane, above the frame -->
  <circle cx="320" cy="144" r="5" fill="#e8920c"/>
  <line x1="320" y1="144" x2="470" y2="144" stroke="#e8920c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="476" y="140" font-size="13" fill="#c98a00" font-weight="700">sunY = cy − fpx·tan α</text>
  <text x="476" y="158" font-size="12" fill="#c98a00">(far off the top of the frame —</text>
  <text x="476" y="174" font-size="12" fill="#c98a00">the off-axis flare condition)</text>

  <!-- fpx bracket -->
  <line x1="110" y1="575" x2="320" y2="575" stroke="#555" stroke-width="1"/>
  <line x1="110" y1="570" x2="110" y2="580" stroke="#555" stroke-width="1"/>
  <line x1="320" y1="570" x2="320" y2="580" stroke="#555" stroke-width="1"/>
  <text x="215" y="592" text-anchor="middle" font-size="13" fill="#555">fpx = origH / (2·tan(vFOV/2))</text>
</svg>
