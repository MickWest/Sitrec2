<text x="490.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">time →</text>
<rect x="114.0" y="310.0" width="284.0" height="106.0" rx="4" fill="#F4DEDB"/>
<text x="126.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">The same shape, upside down.</text>
<text x="126.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B5372E" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">share = cos²θ = 0.96</text>
<text x="126.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B5372E" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">A squared cosine ignores the sign</text>
<text x="126.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B5372E" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">and the size. The old test called</text>
<text x="126.0" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B5372E" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">this a match.</text>
<rect x="478.0" y="310.0" width="260.0" height="106.0" rx="4" fill="#DDEFEC"/>
<text x="490.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">A broad bump against one brief spike.</text>
<text x="490.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0A9384" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">β = 0.00, matching time = 0%</text>
<text x="490.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0A9384" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">No one scale turns the blue curve</text>
<text x="490.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0A9384" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">into the amber one, so the test</text>
<text x="490.0" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0A9384" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">now declines it.</text>
<text x="380.0" y="442.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">The candidate here never turns. It flies straight and changes speed once, halfway through the clip.</text>
<text x="380.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Take the straight line off that kink and the leftover is a tent, rising and falling on the platform&#x27;s own</text>
<text x="380.0" y="474.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">schedule but inverted — and the old share, a squared cosine, ignores both the sign and the size, so it</text>
<text x="380.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">scored this as high as a true match. An inverted match is no warning in itself either: a candidate</text>
<text x="380.0" y="506.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">guessed too far away produces exactly one. Acceleration separates them at once. A turn is a sustained</text>
<text x="380.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">push through the whole manoeuvre; a speed change is one short push, and nothing at all either side of it.</text>
<text x="380.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Drawn for one coordinate, over 101 assessed frames; the shipped test uses all three at once, at three smoothing</text>
<text x="380.0" y="572.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">windows, and counts a frame only where the platform&#x27;s own acceleration reaches 0.01 g. Each column shares one</text>
<text x="380.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">vertical scale, set to fit it. The acceleration curves are blank at both ends: a second difference needs a frame either side.</text>
</svg>
