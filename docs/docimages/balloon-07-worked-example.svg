<title id="title">7. Worked example: a slow object seen from a fast camera</title><desc id="desc">Top view of a camera moving north at 50 m/s and an object drifting east at 4 m/s and north at 2 m/s while rising at 0.5 m/s. Rays join simultaneous positions. Range curve includes vertical separation and reference-surface curvature.</desc>
