<text x="174.3" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#C9690F" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">0.09 g</text>
<text x="170.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#C9690F" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">total for the balloon class: 0 + 0.32 + 0 = 0.32 decades, about twice outside the band</text>
<text x="380.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Cost = the decades each requirement sits outside the band, summed; take the best class. 0 = some ordinary class contains it.</text>
<text x="380.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Reported beside each candidate as a diagnostic: it never changes the ranking.</text>
<text x="380.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">scale, per requirement: 0 inside · 0.3 a factor of two outside · 1 ten times · 2 a hundred times</text>
</svg>
