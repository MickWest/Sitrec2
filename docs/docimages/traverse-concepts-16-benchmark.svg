<text x="638.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">deliberately impossible objects:</text>
<text x="638.0" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">instant turns, 50 g, Mach 5 and Mach 50</text>
<text x="638.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">answer key on the back</text>
<text x="380.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Every scenario has known truth and is run blind: the analysis never sees the key.</text>
<text x="380.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Scoring compares the answer with the key afterwards.</text>
<text x="380.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7E8893" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Impossible objects test that nothing is explained away; balloons test that the ordinary answer is found when it exists.</text>
