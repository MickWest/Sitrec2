<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="356" fill="#FFFFFF"/>
<defs></defs>
<text x="380.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17202A" text-anchor="middle" style="">IFOV: what one pixel can and cannot say about size</text>
<polygon points="70.0,170.0 710.0,142.0 710.0,198.0" fill="#DCE6F8" stroke="#DCE6F8" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="70.0" y1="170.0" x2="710.0" y2="142.0" stroke="#2F6FD6" stroke-width="1.2"/>
<line x1="70.0" y1="170.0" x2="710.0" y2="198.0" stroke="#2F6FD6" stroke-width="1.2"/>
<circle cx="70.0" cy="170.0" r="7" fill="#2F6FD6"/>
<text x="70.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6FD6" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">camera</text>
<text x="706.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#2F6FD6" text-anchor="end" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">one pixel: the IFOV cone (16.9 arcsec = 0.0047° here)</text>
<circle cx="93.0" cy="170.0" r="8.568" fill="#0A9384"/>
<line x1="93.0" y1="140.0" x2="93.0" y2="159.0" stroke="#0A9384" stroke-width="1"/>
<text x="40.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#0A9384" text-anchor="start" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">at 500 m a 0.35 m balloon is 8 pixels wide: resolved</text>
<circle cx="268.4" cy="170.0" r="7.9856" fill="#0A9384"/>
<text x="268.4" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#0A9384" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">at 4.3 km it just fills the pixel</text>
<circle cx="678.0" cy="170.0" r="8.866666666666665" fill="#0A9384"/>
<text x="688.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#0A9384" text-anchor="end" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">at 14 km: a third of a pixel</text>
<text x="380.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">Sub-pixel means the published angular size is an UPPER bound:</text>
<text x="380.0" y="298.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">the object is no wider than the cone at that range, and could be far smaller.</text>
<text x="380.0" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">It still refutes: a class whose smallest member is D_min cannot be closer than D_min ÷ the published bound</text>
<text x="380.0" y="338.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#4E5A66" text-anchor="middle" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round;">(two pixels here, 0.0094°: 611 m for a 0.10 m bird).</text>
</svg>
