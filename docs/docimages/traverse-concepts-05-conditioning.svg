<text x="380.0" y="26.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#17202A" text-anchor="middle" style="">Conditioning: can the rays pin a range at all?</text>
<text x="40.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17202A" text-anchor="start" style="">rays crossing steeply: a crisp intersection</text>
<text x="400.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17202A" text-anchor="start" style="">rays nearly parallel: a smear</text>
