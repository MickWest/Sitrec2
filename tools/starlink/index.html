<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Predicts Starlink horizon-flare times and sky directions for a fixed location or along a flight path.">
  <title>Starlink Flare Predictor</title>

  <!-- Installable web app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flares">

  <link rel="stylesheet" href="style.css?v=__BUILD_V__">
</head>
<body>
  <div id="form-screen" class="screen">
  <header class="app-header">
    <h1>Starlink Flare Predictor</h1>
  </header>

  <main>
    <form id="form" autocomplete="off" novalidate>
      <div class="field combo">
        <label for="origin">Origin <span class="opt">(blank for current location)</span></label>
        <input id="origin" name="origin" type="text" inputmode="text"
               placeholder="Airport code, name, or place — e.g. LAX, Heathrow, Paris"
               aria-autocomplete="list" aria-expanded="false" autocapitalize="off"
               spellcheck="false">
        <div class="suggestions" id="origin-suggestions" role="listbox" hidden></div>
      </div>

      <div class="field combo">
        <label for="dest">Destination <span class="opt">(optional)</span></label>
        <input id="dest" name="dest" type="text" inputmode="text"
               placeholder="Airport code, name, or place"
               aria-autocomplete="list" aria-expanded="false" autocapitalize="off"
               spellcheck="false">
        <div class="suggestions" id="dest-suggestions" role="listbox" hidden></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date">
        </div>
        <div class="field">
          <label for="time">Time</label>
          <input id="time" name="time" type="time">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="duration">Flight duration (hrs)</label>
          <input id="duration" name="duration" type="number" min="0" step="0.1"
                 inputmode="decimal" placeholder="auto">
        </div>
        <div class="field">
          <label for="alt">Cruise altitude (ft)</label>
          <input id="alt" name="alt" type="number" min="0" step="500"
                 inputmode="numeric" placeholder="37000">
        </div>
      </div>

      <button id="go" type="submit" class="go-btn">Find Flares</button>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="field file-field">
          <label>Satellite data</label>
          <p class="help">Synthetic by default. For real satellites:</p>
          <button id="fetchtle" type="button" class="adv-btn">Fetch current TLE</button>
          <div id="tlestatus" class="help" aria-live="polite"></div>
          <label for="tlefile" class="sub-label">…or load your own .tle file</label>
          <input id="tlefile" name="tlefile" type="file" accept=".tle,.txt">
        </div>
      </details>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <footer class="app-footer">
    <p>Flare physics adapted from
      <a href="https://github.com/MickWest/Sitrec2" rel="noopener" target="_blank">Sitrec</a>.
      Predictions are approximate — flares are brief and sensitive to antenna orientation.</p>
  </footer>
  </div><!-- /form-screen -->

  <section id="results-screen" class="screen" hidden>
    <div class="results-bar">
      <button id="edit" type="button" class="edit-btn" aria-label="Edit inputs">&#8249; Edit</button>
      <span class="results-bar-title">Starlink Flares</span>
    </div>
    <div id="results" class="results" aria-live="polite"></div>
  </section>

  <script type="module" src="app.js?v=__BUILD_V__"></script>
</body>
</html>
