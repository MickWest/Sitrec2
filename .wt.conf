# .wt.conf — Sitrec worktree configuration
# Used by the wt command (sitrec-tools/wt.sh + _wt).
# Machine-specific overrides can go in .wt.local.conf (sourced after this).

PROJECT_NAME="sitrec"
GITHUB_REPO="MickWest/Sitrec2"

# Shared directories (symlinked into worktrees to save space / build time)
SYMLINK_DIRS=("node_modules" "sitrecServer/vendor" "tools/SitrecBridge/node_modules")

# Gitignored config files (copied into each worktree). These are the ONLY way
# secrets reach a worktree — they never go in the private repo.
COPY_FILES=("config/config.js" "config/config-install.js" "config/config.php" "config/shared.env" ".env" ".mcp.json" ".claude/settings.local.json")

# The nested PRIVATE repo (own .git, gitignored here). wt branches it in lockstep:
# every worktree gets a twin at <wt>/$PRIVATE_DIR on a branch of the same name.
PRIVATE_DIR="private"

# Agent-written notes (plans, handoffs, findings) — inside the private repo, so
# they are branch-local and come back to main with `wt merge`.
AGENT_DOCS_DIR="private/notes"

# Link-backs created in every worktree so Claude Code and Codex find their
# instructions, commands and skills. Two shapes, because the tools differ:
#  - LINK_PATHS: a whole path symlinked (Codex follows symlinked dirs/files).
#  - LINK_DIR_ENTRIES: the kind-directory is created REAL and each entry inside
#    is symlinked — Claude Code ignores a symlinked .claude/<kind> directory but
#    follows symlinked entries (measured 2026-08-21).
LINK_PATHS=("AGENTS.md:private/AGENTS.md" ".agents:private/agents")
LINK_DIR_ENTRIES=(".claude/commands:private/claude/commands" ".claude/agents:private/claude/agents" ".claude/skills:private/claude/skills")

# Content of <wt>/CLAUDE.md — a one-line import of the private instructions.
CLAUDE_MD_IMPORT="@private/CLAUDE.md"

# Build command
BUILD_CMD="npm run build"

# Local web server (set in .wt.local.conf if this machine differs)
BASE_URL="https://local.metabunk.org"
SITES_DIR="/Users/mick/Sites"

# MCP server process pattern for orphan cleanup
MCP_PATTERN="SitrecBridge/mcp-server.js"
