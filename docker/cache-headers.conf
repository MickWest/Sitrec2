# Browser caching for the application files at the web root, chosen by file name.
#
# A file whose name carries a content hash never changes under that URL — a new
# build gets a new name — so it may be kept for a year without a check. A file
# with a fixed name changes under the same URL at every release, so the browser
# must check it before use. `no-cache` still stores the file; a check that finds
# it unchanged costs one 304.
#
# Without a header the browser guesses a freshness period from Last-Modified, and
# can reuse the previous release's index.html for hours after a deploy. That page
# names the previous bootstrap bundle, which the new release no longer has, and
# Sitrec fails to start. The <meta http-equiv="Cache-Control"> in index.html does
# not prevent this: browsers ignore it for HTTP caching.
#
# Hashed names, from the production webpack output:
#   name.<20 hex>.bundle.js   entry, chunk and worker bundles
#   <20 hex>.js / .wasm       asset modules
#   name.<8 hex>.css          extracted CSS chunks
#
# Only files directly in /var/www/html match. User uploads live below it in
# sitrec-upload/, and a hash-like upload name must not be cached for a year.
#
# `set`, not `always`: a 404 for a hashed name must not be cached for a year.
# Apache still sends these headers on a 304.
<IfModule mod_headers.c>
    <If "%{REQUEST_FILENAME} =~ m#^/var/www/html/(?:[^/]+\.[0-9a-f]{20}\.bundle\.js|[0-9a-f]{20}\.(?:js|wasm)|[^/]+\.[0-9a-f]{8}\.css)$#">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
    <ElseIf "%{REQUEST_FILENAME} =~ m#^/var/www/html/(?:index\.html|index\.css|app-entry\.json|build-info\.json|sitrec-runtime-env\.js|sitrec-channel-config\.js)?$#">
        Header set Cache-Control "no-cache"
    </ElseIf>
</IfModule>

# Files users uploaded (sitrec-upload/) and files fetched from other hosts
# (sitrec-cache/) are served from the app's own origin, so one that a browser
# renders as a page — an HTML, SVG or XML upload — would run its script with
# the viewer's Sitrec session. A sandbox CSP gives such a page a unique origin
# and no script, whatever type Apache declares. It does not affect Sitrec: the
# app reads these files with fetch(), <img> and <video>, and a policy on a
# fetched file applies only when that file is opened as a page itself.
# style-src keeps the browser's own image and video viewer laid out when a
# file is opened directly.
# rehost.php refuses the obvious page types, or stores HTML as .txt; this
# covers the rest (XML, KML, and unknown extensions sent with no type) in the
# container. It is in this file, not security-headers.conf, because it is
# chosen by path like the rules above; security-headers.conf holds the headers
# sent on every response.
<IfModule mod_headers.c>
    <If "%{REQUEST_FILENAME} =~ m#^/var/www/html/sitrec-(?:upload|cache)/#">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
    </If>
</IfModule>
