# Response headers set on every reply from the Sitrec container.
#
# Deliberately only two, and both chosen because they cannot break a feature.
#
#   nosniff   stops a browser second-guessing a declared Content-Type. It matters
#             here because Sitrec serves user-supplied files back to the page.
#
#   Referrer-Policy  is already Chrome's default, so it changes nothing there and
#             improves browsers that still send a full URL cross-origin. Sitrec
#             URLs carry the sitch name and often a position in the query string,
#             so a full referrer leaks where the user was looking.
#
# NOT set here, each because it needs a decision this image cannot make for the
# deployment it lands in — see docs/dev/SecurityHeaders.md:
#
#   Content-Security-Policy    high value, but the correct source list depends on
#                              which map, elevation and AI providers the operator
#                              enabled; a wrong one silently breaks the globe.
#   Strict-Transport-Security  applies to the whole host, not just this path, and
#                              is the reverse proxy's decision, not the origin's.
#   X-Frame-Options            depends on whether the operator embeds Sitrec.
#   Permissions-Policy         Sitrec USES geolocation and device orientation
#                              (src/GeoLocation.js, src/ARMode.js). A restrictive
#                              policy disables "use my location" and AR mode.
#
# `always` matters: without it the header is attached only to 2xx/3xx replies and
# is missing from exactly the error responses where sniffing is most interesting.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
