name: Cleanup container images

# Weekly sweep of old GHCR container versions. Three cleanup passes run in order:
#
#   1. Delete temporary build and staging versions older than seven days. Keeping
#      recent wrappers allows failed jobs to retry with their recorded digests.
#
#   2. Delete old semver versions beyond the newest 20. The 'latest' tag is
#      implicitly preserved because it always points at the newest semver, which
#      stays in the kept set.
#
#   3. Delete untagged manifests that nothing references any more. "Untagged" alone
#      is NOT a safe test — see the long comment on that step.
#
# Manual trigger accepts dry_run=true to preview all three steps without deleting.

on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 3am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without actually deleting'
        type: boolean
        default: false

# Shared with docker.yml for the ENTIRE run, including package pushes and signing.
# Queue releases instead of canceling pending runs when a cleanup is waiting.
concurrency:
  group: sitrec-container-registry
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      PKG: sitrec2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MIN_AGE_DAYS: '7'
    steps:
      - name: Prune leftover build-* tags
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "-${MIN_AGE_DAYS} days" +%s)
          # Only old versions whose tags are ALL temporary build tags are debris.
          #
          # "all", not "any". build-index-<sha> is the staging tag the release job
          # pushes before attesting; on a successful run it names the SAME version
          # as that release, because the bytes are identical. Selecting on "any"
          # would delete the release along with the staging tag it shares. A run
          # that failed between staging and tagging leaves a version carrying only
          # the staging tag, and that one is real debris — this is what collects it.
          ALL=$(gh api "/user/packages/container/${PKG}/versions" --paginate | jq -s 'add')
          mapfile -t VIDS < <(
            echo "$ALL" | jq -r --argjson cutoff "$CUTOFF" '
              .[]
              | . as $v
              | (.metadata.container.tags // []) as $tags
              | select($tags | length > 0)
              | select($tags | map(test("^build-(amd64|arm64|index)-")) | all)
              | select((($v.updated_at // $v.created_at) | fromdateiso8601) < $cutoff)
              | "\($v.id) \($tags | join(","))"
            '
          )
          echo "Found ${#VIDS[@]} build-* version(s)"
          for line in "${VIDS[@]}"; do
            vid="${line%% *}"
            tags="${line#* }"
            echo "  version ${vid}  tags=${tags}"
            # Recorded whether or not it is deleted here, so the third pass can see
            # what a real run removes and a dry run previews the same deletions.
            echo "$vid" >> "${RUNNER_TEMP}/pruned-ids.txt"
            if [ "$DRY_RUN" = "true" ]; then
              echo "    (dry run — skipped)"
            else
              gh api --method DELETE "/user/packages/container/${PKG}/versions/${vid}"
            fi
          done

      - name: Prune old semver versions (keep newest 20)
        run: |
          KEEP=20
          # Build a list of {id, parts} for every version that has a semver tag,
          # sort by version parts descending, then slice off the top KEEP and
          # emit the rest as deletion candidates. 'latest' sits on the newest
          # semver version, which is always in the kept set.
          ALL=$(gh api "/user/packages/container/${PKG}/versions" --paginate | jq -s 'add')
          mapfile -t OLD < <(
            echo "$ALL" | jq -r --argjson keep "$KEEP" '
              [
                .[]
                | . as $v
                | (.metadata.container.tags // []) as $tags
                | ($tags | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))) as $semvers
                | select(($semvers | length) > 0)
                | {id: $v.id, tag: $semvers[0], parts: ($semvers[0] | split(".") | map(tonumber))}
              ]
              | sort_by(.parts)
              | reverse
              | .[$keep:]
              | .[]
              | "\(.id) \(.tag)"
            '
          )
          echo "Found ${#OLD[@]} old semver version(s) to delete (keeping newest ${KEEP})"
          for line in "${OLD[@]}"; do
            vid="${line%% *}"
            tag="${line#* }"
            echo "  version ${vid}  tag=${tag}"
            echo "$vid" >> "${RUNNER_TEMP}/pruned-ids.txt"
            if [ "$DRY_RUN" = "true" ]; then
              echo "    (dry run — skipped)"
            else
              gh api --method DELETE "/user/packages/container/${PKG}/versions/${vid}"
            fi
          done

      # Delete untagged manifests that nothing references any more.
      #
      # This must NOT be actions/delete-package-versions with
      # delete-only-untagged-versions. In GHCR a multi-architecture image is stored
      # as several versions: the index carries the tag, and each per-platform
      # manifest inside it is a separate version with NO tag of its own. So
      # "delete untagged, keep the newest 10" deletes the contents of live
      # releases. It did exactly that: the run on 2026-09-06 reported 100 versions
      # deleted, and afterwards every tag from 2.147.1 to 2.151.2 was an index
      # whose children returned 404 — the tag still resolves, and `docker pull`
      # fails with "manifest unknown".
      #
      # So work out what is actually referenced before deleting anything. Start
      # from every tagged version, walk each index down to its children, and repeat
      # until the set stops growing. That set holds the platform manifests of live
      # releases, the build provenance attestations stored beside them, and the
      # sigstore bundles those point at. Everything untagged and outside it is
      # debris from a deleted index.
      #
      # The age guard is a second line of defence: a manifest pushed minutes ago
      # may belong to a build whose index is not tagged yet.
      #
      # Note this deliberately keeps every sha256-<digest> version. Those are the
      # registry copies of build attestations, which GHCR stores as tags because it
      # does not serve the OCI referrers API. They are tagged, so they are never
      # candidates here, and a few of them outlive the release they describe. That
      # is a slow, harmless leak, and much the better failure than deleting one.
      - name: Prune unreferenced untagged manifests
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          BODY="${RUNNER_TEMP}/manifest.json"

          # A registry pull token. It is short-lived, so the walk below refreshes it
          # rather than assuming one lasts the whole run. Basic auth with the
          # workflow token also works if this package is ever made private.
          registry_token() {
            curl -fsSL --connect-timeout 15 --max-time 60 -u "x:${GH_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${OWNER}/${PKG}:pull&service=ghcr.io" \
              | jq -er '.token | select(type == "string" and length > 0)'
          }
          REG_TOKEN=$(registry_token)

          # Drop what the first two passes remove. In a real run they are already
          # gone and this changes nothing. In a dry run they are still present and
          # still tagged, so without this they would anchor the closure and hide
          # every manifest they are about to orphan — a preview that shows less
          # than the run it is previewing.
          PRUNED="${RUNNER_TEMP}/pruned-ids.txt"
          [ -f "$PRUNED" ] || : > "$PRUNED"
          PRUNED_IDS=$(jq -R -s 'split("\n") | map(select(length > 0) | tonumber)' < "$PRUNED")
          echo "Removed by the earlier passes: $(printf '%s' "$PRUNED_IDS" | jq 'length')"

          ALL=$(gh api "/user/packages/container/${PKG}/versions" --paginate \
            | jq -s --argjson pruned "$PRUNED_IDS" \
                'add | map(select(.id as $id | ($pruned | index($id)) | not))')

          # Every digest one manifest names: an index names its children, and an
          # attestation manifest names its subject.
          #
          # Any answer other than 200 or 404 stops the whole step. A transient
          # registry failure read as "this index has no children" would drop live
          # platform manifests out of the keep set and delete them — the exact
          # accident this step exists to prevent — so it must never be shrugged off.
          # A 404 is different and is fine: that digest is already gone, which is
          # true of the releases the old prune emptied.
          children_of() {
            local digest="$1" code attempt
            for attempt in 1 2; do
              if ! code=$(curl -sSL --connect-timeout 15 --max-time 60 -o "$BODY" -w '%{http_code}' \
                -H "Authorization: Bearer ${REG_TOKEN}" -H "Accept: ${ACCEPT}" \
                "https://ghcr.io/v2/${OWNER}/${PKG}/manifests/${digest}"); then
                echo "::error::Incomplete manifest download for ${digest}" >&2
                return 2
              fi
              case "$code" in
                200)
                  # This function is called in an OR-list: set -e does not protect
                  # commands inside it. Check every failure explicitly. Validate a
                  # single complete document before emitting any child descriptors;
                  # a valid image leaf has zero children and must still succeed.
                  if ! jq -e -s '
                    def descriptor:
                      type == "object" and
                      (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                      (.mediaType | type == "string" and length > 0) and
                      (.size | type == "number" and . >= 0 and . == floor);
                    length == 1 and (.[0] |
                      type == "object" and .schemaVersion == 2 and
                      (if .mediaType == "application/vnd.oci.image.index.v1+json" or
                          .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
                       then (.manifests | type == "array" and all(.[]; descriptor))
                       elif .mediaType == "application/vnd.oci.image.manifest.v1+json" or
                            .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
                       then (.config | descriptor) and (.layers | type == "array" and all(.[]; descriptor))
                       else false end) and
                      (if has("subject") then (.subject | descriptor) else true end))
                  ' "$BODY" > /dev/null; then
                    echo "::error::Invalid manifest document for ${digest}" >&2
                    return 2
                  fi
                  jq -r '(.manifests // [])[] .digest, (.subject.digest // empty)' "$BODY" || return 2
                  return 0
                  ;;
                404) return 0 ;;
                401|403) REG_TOKEN=$(registry_token) || return 2 ;;
                *) echo "::error::GHCR returned ${code} for ${digest}" >&2; return 2 ;;
              esac
            done
            echo "::error::GHCR still returned ${code} for ${digest} after a token refresh" >&2
            return 2
          }

          KEEP="${RUNNER_TEMP}/keep.txt"
          FRONTIER="${RUNNER_TEMP}/frontier.txt"
          NEXT="${RUNNER_TEMP}/next.txt"
          echo "$ALL" \
            | jq -r '.[] | select(((.metadata.container.tags // []) | length) > 0) | .name' \
            | sort -u > "$FRONTIER"

          # If the seed is empty the closure is empty, and every untagged version
          # looks like debris. Refuse: an empty seed means the versions API answered
          # in a shape this script does not understand, not that nothing is tagged.
          if [ ! -s "$FRONTIER" ]; then
            echo "::error::No tagged versions found — refusing to delete anything"
            exit 1
          fi
          cp "$FRONTIER" "$KEEP"
          echo "Tagged versions: $(wc -l < "$FRONTIER")"

          while [ -s "$FRONTIER" ]; do
            : > "$NEXT"
            while read -r digest; do
              children_of "$digest" >> "$NEXT" || exit 1
            done < "$FRONTIER"
            sort -u "$NEXT" -o "$NEXT"
            comm -23 "$NEXT" "$KEEP" > "$FRONTIER"
            cat "$FRONTIER" >> "$KEEP"
            sort -u "$KEEP" -o "$KEEP"
          done
          echo "Referenced digests, tagged and below: $(wc -l < "$KEEP")"

          CUTOFF=$(date -u -d "-${MIN_AGE_DAYS} days" +%s)
          mapfile -t CANDIDATES < <(
            echo "$ALL" | jq -r --argjson cutoff "$CUTOFF" '
              .[]
              | select(((.metadata.container.tags // []) | length) == 0)
              | select(((.updated_at // .created_at) | fromdateiso8601) < $cutoff)
              | "\(.id) \(.name)"
            '
          )
          echo "Untagged versions older than ${MIN_AGE_DAYS} days: ${#CANDIDATES[@]}"

          DELETED=0
          for line in "${CANDIDATES[@]}"; do
            vid="${line%% *}"
            digest="${line#* }"
            if grep -qxF "$digest" "$KEEP"; then
              continue
            fi
            echo "  version ${vid}  ${digest}"
            if [ "$DRY_RUN" = "true" ]; then
              echo "    (dry run — skipped)"
            else
              gh api --method DELETE "/user/packages/container/${PKG}/versions/${vid}"
            fi
            DELETED=$((DELETED + 1))
          done
          echo "Unreferenced untagged versions deleted: ${DELETED}"
