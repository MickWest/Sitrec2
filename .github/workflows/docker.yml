name: Docker Image

# Build and publish multi-arch Docker images to GitHub Container Registry.
# Triggers on version tags (e.g. 2.36.4) and can be run manually.
#
# Architecture: four-stage pipeline
#   1. "build-js" runs once on x86 — webpack produces identical output
#      regardless of CPU architecture, so no need to build twice.
#   2. "package" runs natively on both amd64 and arm64 runners,
#      copying the JS artifacts into the PHP+Apache runtime image.
#   3. "smoke-test" pulls the amd64 image, starts the container, and runs
#      HTTP checks + a Playwright visual regression test to verify it works.
#   4. "manifest" creates the multi-arch manifest list so a single
#      image tag works on both architectures (only if smoke tests pass).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'    # matches tags like 12.19.0
  workflow_dispatch:               # manual trigger for testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # lowercased in each job below

jobs:
  # ── Stage 1: Build JS artifacts (runs once on x86) ─────────────
  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # full clone so git describe works for version string

      - name: Copy example configs for clean build
        run: |
          cp config/config.js.example config/config.js
          cp config/shared.env.example config/shared.env
          cp config/config.php.example config/config.php
          # Write CI-specific config-install.js that outputs directly to dist/
          # (the example config uses a branch-based subdirectory like dist/sitrec/
          # which doesn't match what Dockerfile.release expects)
          cat > config/config-install.js << 'JSEOF'
          const path = require('path');
          module.exports = {
              dev_path: path.resolve(__dirname, '..', 'dist'),
              prod_path: path.resolve(__dirname, '..', 'dist'),
              buildFolder: '',
          };
          JSEOF

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build production bundle
        run: npx webpack --config webpack.prod.js
        env:
          DOCKER_BUILD: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Stage 2: Package into Docker images (native per-arch) ──────
  package:
    needs: build-js
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR's package-version UI reads org.opencontainers.image.description
          # from manifest *annotations*, not image config labels. Emit annotations
          # at the manifest level so each per-platform sha256 row gets a description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          # The labels: and annotations: inputs are independent in metadata-action —
          # labels: only affects the labels output, annotations: only affects the
          # annotations output. GHCR reads description from annotations, so it must
          # be overridden via the annotations: input too.
          labels: |
            org.opencontainers.image.description=Sitrec (${{ matrix.platform }})
          annotations: |
            org.opencontainers.image.description=Sitrec (${{ matrix.platform }})

      - name: Build and push (single-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:build-${{ matrix.suffix }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max

  # ── Stage 3: Smoke-test the Docker image ──────────────────────────
  smoke-test:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Playwright base image (external, hosted on MCR). Bump in lockstep with
      # the `playwright` devDependency in package.json. Single source of truth:
      # referenced by the cache key, the cache/pull step, and the test run.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Docker container
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"
          # Canonical mapping emitted by docker-compose.yml / install.sh /
          # install.ps1 / the docs: host:container both 8080 (the container now
          # listens on the unprivileged 8080 by default so it runs as any UID).
          docker run -d --name sitrec-smoke \
            -p 8080:8080 \
            -e NO_TERRAIN=true \
            "${IMAGE}"

      - name: Wait for container to respond
        run: |
          echo "Waiting for HTTP 200 from container..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Container is ready (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container failed to respond after 60s"
          docker logs sitrec-smoke
          exit 1

      - name: HTTP smoke tests
        run: |
          BODY=$(curl -sf http://localhost:8080/)

          # Verify entrypoint injected runtime env vars into HTML
          echo "$BODY" | grep -q '__SITREC_ENV__' \
            && echo "✓ Runtime env injection present" \
            || { echo "✗ Missing __SITREC_ENV__ in HTML"; exit 1; }

          # Verify webpack output (script bundles present)
          echo "$BODY" | grep -q '<script' \
            && echo "✓ Script tags present" \
            || { echo "✗ Missing script tags in HTML"; exit 1; }

          echo "All HTTP smoke tests passed"

      - name: Legacy port-80 back-compat smoke test
        run: |
          # Older installs (pre-8080) map the host to the container's legacy
          # port 80. When the container runs as root — the default here, since
          # GitHub runners use rootful Docker — the entrypoint also listens on
          # 80 so those mappings keep working. Verify that compat shim so we
          # don't silently break upgrading users.
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          docker run -d --name sitrec-smoke-legacy \
            -p 8081:80 \
            -e NO_TERRAIN=true \
            "${IMAGE}"
          echo "Waiting for HTTP 200 via legacy :80 mapping..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "✓ Legacy 8080:80 mapping still serves (root dual-listen)"
              docker rm -f sitrec-smoke-legacy
              exit 0
            fi
            sleep 2
          done
          echo "::error::Legacy port-80 back-compat mapping failed to respond"
          docker logs sitrec-smoke-legacy
          docker rm -f sitrec-smoke-legacy
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # MCR rate-limits (toomanyrequests) and occasionally WAF-blocks
      # (unauthorized) GitHub runners' shared egress IPs, and the throttle
      # window can outlast a short retry budget. Cache the image tarball keyed
      # by version so the common path (unchanged Playwright version) never
      # touches MCR; only the first run after a version bump pulls.
      - name: Cache Playwright image
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: /tmp/playwright-image.tar
          key: playwright-image-${{ env.PLAYWRIGHT_IMAGE }}

      - name: Load or pull Playwright image (with retry)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ] && [ -f /tmp/playwright-image.tar ]; then
            echo "Loading Playwright image from cache"
            docker load -i /tmp/playwright-image.tar
            exit 0
          fi
          # Cache miss: pull from MCR with exponential-ish backoff + jitter,
          # then save the tarball so actions/cache persists it for next time.
          for i in $(seq 1 6); do
            if docker pull "$PLAYWRIGHT_IMAGE"; then
              docker save "$PLAYWRIGHT_IMAGE" -o /tmp/playwright-image.tar
              exit 0
            fi
            backoff=$(( i * 20 + (RANDOM % 15) ))
            echo "Pull attempt $i failed, retrying in ${backoff}s..."
            sleep "$backoff"
          done
          echo "All pull attempts failed"
          exit 1

      - name: Run Playwright smoke test
        run: |
          docker run --rm --ipc=host --network=host \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e DOCKER_SMOKE_URL=http://localhost:8080 \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --config=playwright.docker.config.js

      - name: Upload smoke test snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-snapshots
          path: |
            tests_regression/docker-smoke.test.js-snapshots/
            test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker logs sitrec-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f sitrec-smoke || true

  # ── Stage 4: Create multi-arch manifest ─────────────────────────
  manifest:
    needs: [package, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Check if this is the newest version tag
        id: check-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Current tag from the ref (e.g. "2.41.1")
          THIS_TAG="${GITHUB_REF_NAME}"
          echo "This tag: ${THIS_TAG}"

          # Find the highest semver tag in the repo
          NEWEST=$(gh api "repos/${{ github.repository }}/git/refs/tags" \
            --paginate --jq '.[].ref' \
            | sed 's|refs/tags/||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          echo "Newest tag: ${NEWEST}"

          if [ "$THIS_TAG" = "$NEWEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "→ This IS the newest tag, will update 'latest'"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "→ A newer tag exists (${NEWEST}), skipping 'latest'"
          fi

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Index-level annotations show up on the tagged row in GHCR's UI
          # (e.g. the "2.44.7" / "latest" entry). Consumed by imagetools create
          # below — metadata-action emits them in "index:key=value" format.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=semver,pattern={{version}}
            ${{ steps.check-latest.outputs.is_latest == 'true' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.description=Sitrec (multi-arch)
          annotations: |
            org.opencontainers.image.description=Sitrec (multi-arch)

      - name: Create and push multi-arch manifest
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          SOURCE_AMD64="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          SOURCE_ARM64="${REGISTRY}/${IMAGE_NAME_LC}:build-arm64-${GITHUB_SHA}"

          # Turn each "index:key=value" line from metadata-action into a
          # --annotation flag. Passed via env var (not inline expansion)
          # so values with special characters don't break the shell.
          ANNOTATION_ARGS=()
          while IFS= read -r ann; do
            [ -z "$ann" ] && continue
            ANNOTATION_ARGS+=(--annotation "$ann")
          done <<< "$ANNOTATIONS"

          # Create a manifest for each target tag (e.g. 2.41.1, latest)
          echo '${{ steps.meta.outputs.tags }}' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest for: $tag"
            docker buildx imagetools create \
              "${ANNOTATION_ARGS[@]}" \
              --tag "${tag}" \
              "${SOURCE_AMD64}" \
              "${SOURCE_ARM64}"
          done

      - name: Clean up per-arch build tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${IMAGE_NAME_LC##*/}"
          for SUFFIX in amd64 arm64; do
            TAG="build-${SUFFIX}-${GITHUB_SHA}"
            echo "Deleting tag: ${TAG}"
            # Find the version ID for this tag
            VID=$(gh api "/user/packages/container/${PKG}/versions" \
              --paginate --jq ".[] | select(.metadata.container.tags[] == \"${TAG}\") | .id")
            if [ -n "$VID" ]; then
              gh api --method DELETE "/user/packages/container/${PKG}/versions/${VID}"
              echo "Deleted version ${VID} (${TAG})"
            else
              echo "Warning: could not find version for tag ${TAG}"
            fi
          done
