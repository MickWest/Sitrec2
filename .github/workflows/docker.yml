name: Docker Image

# Build and publish multi-arch Docker images to GitHub Container Registry.
# Triggers on version tags (e.g. 2.36.4) and can be run manually.
#
# Architecture: four-stage pipeline
#   1. "build-js" runs once on x86 — webpack produces identical output
#      regardless of CPU architecture, so no need to build twice.
#   2. "package" runs natively on both amd64 and arm64 runners, copying the
#      JS artifacts into the PHP+Apache runtime image, then runs the container
#      security review over the image it just built — once per architecture,
#      each on a runner of its own architecture.
#   3. "smoke-test" pulls the amd64 image, starts the container, and runs
#      HTTP checks + a Playwright visual regression test to verify it works.
#   4. "manifest" creates the multi-arch manifest list so a single
#      image tag works on both architectures (only if smoke tests pass).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'    # matches tags like 12.19.0
  workflow_dispatch:               # manual trigger for testing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # lowercased in each job below

jobs:
  # ── Stage 1: Build JS artifacts (runs once on x86) ─────────────
  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # full clone so git describe works for version string

      - name: Copy example configs for clean build
        run: |
          cp config/config.js.example config/config.js
          cp config/shared.env.example config/shared.env
          cp config/config.php.example config/config.php
          # Write CI-specific config-install.js that outputs directly to dist/
          # (the example config uses a branch-based subdirectory like dist/sitrec/
          # which doesn't match what Dockerfile.release expects)
          cat > config/config-install.js << 'JSEOF'
          const path = require('path');
          module.exports = {
              dev_path: path.resolve(__dirname, '..', 'dist'),
              prod_path: path.resolve(__dirname, '..', 'dist'),
              buildFolder: '',
          };
          JSEOF

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build production bundle
        run: npx webpack --config webpack.prod.js
        env:
          DOCKER_BUILD: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Stage 2: Package into Docker images (native per-arch) ──────
  package:
    needs: build-js
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Build provenance attestation (see the step after the push). id-token is what
      # signs it through Sigstore; attestations is what records it against the repo.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR's package-version UI reads org.opencontainers.image.description
          # from manifest *annotations*, not image config labels. Emit annotations
          # at the manifest level so each per-platform sha256 row gets a description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          # The labels: and annotations: inputs are independent in metadata-action —
          # labels: only affects the labels output, annotations: only affects the
          # annotations output. GHCR reads description from annotations, so it must
          # be overridden via the annotations: input too.
          labels: |
            org.opencontainers.image.description=Sitrec (${{ matrix.platform }})
          annotations: |
            org.opencontainers.image.description=Sitrec (${{ matrix.platform }})

      - name: Build and push (single-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:build-${{ matrix.suffix }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max

      # Signed build provenance: which workflow, at which commit, on which runner,
      # produced this exact image digest. BuildKit already attaches its own provenance
      # attestation when it pushes, but that one is unsigned and nothing names it, so
      # nobody can be asked to verify it. This produces a Sigstore-signed attestation
      # recorded against the repository, which anyone can check by digest with:
      #
      #   gh attestation verify oci://ghcr.io/mickwest/sitrec2:<tag> --repo MickWest/Sitrec2
      #
      # push-to-registry stores it beside the image, so verification needs the registry
      # and not this repository's API. Runs per architecture, on the digest that leg
      # just pushed, so both published images carry one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── Container security review ────────────────────────────────────
      # Runs here, in the per-architecture matrix, rather than once in smoke-test.
      # smoke-test only ever had the amd64 image, so the arm64 image was published
      # unreviewed — and while the two are packaged from the same dist/ by the same
      # Dockerfile (so their credentials are identical), their base layers are
      # different builds of Debian and their advisory load and setuid inventory can
      # genuinely differ. Reviewing here also means each image is examined by a
      # runner of its own architecture, with no emulation.
      #
      # The published image is built from config/shared.env.example, so every
      # credential in it must be the shipped placeholder. Nothing else in the
      # pipeline checks that: the bundle secret audit judges a directory a web
      # server will serve, and correctly permits shared.env.php there because PHP
      # never hands that file out — but in an IMAGE the same file is a layer anyone
      # with pull access can read with `docker save`, and the "<?php" guard protects
      # nothing against that.
      #
      # --fail-on=critical gates on the two credential checks only. The posture
      # findings (root by default, the world-writable webroot, the base image's
      # advisory backlog) are reported for the operator rather than treated as
      # release blockers. A failure here stops smoke-test and manifest, so no
      # version or latest tag is ever created.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install trivy
        # Pinned to a tag that exists: this action publishes only v0.2.6, v0.3.0 and
        # v0.3.1, and has no moving v0. An unresolvable action ref fails the job at
        # "Set up job", before any step runs, which is what happened on 2.149.1.
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Container security review
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}:build-${{ matrix.suffix }}-${GITHUB_SHA}"
          # buildx pushed straight to the registry without loading into the local
          # daemon, so the image has to be pulled before it can be inspected.
          docker pull "${IMAGE}"
          node scripts/auditContainerImage.mjs \
            --image="${IMAGE}" \
            --profile=published \
            --out=dist-audit \
            --fail-on=critical

      - name: Publish the review to the run summary
        if: always()
        run: |
          # A Markdown artifact is an opaque zip in the browser — reading it always
          # costs a download. The step summary renders it on the run page itself.
          # Cap at 900K against GitHub's 1 MiB limit; the report is ~25K, so this
          # only ever trips if a future check starts emitting a huge table.
          REPORT=dist-audit/container-security-review.md
          if [ -f "$REPORT" ]; then
            {
              echo "## Container security review — ${{ matrix.platform }}"
              echo
              head -c 900000 "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Container security review — ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
            echo "The review did not produce a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload container security review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per-architecture: two matrix jobs uploading one name would collide.
          name: container-security-review-${{ matrix.suffix }}
          path: |
            dist-audit/container-security-review.md
            dist-audit/container-security-review.json
            dist-audit/sbom.cdx.json
            dist-audit/evidence/
          retention-days: 90

  # ── Stage 3: Smoke-test the Docker image ──────────────────────────
  smoke-test:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Playwright base image (external, hosted on MCR). Bump in lockstep with
      # the `playwright` devDependency in package.json. Single source of truth:
      # referenced by the cache key, the cache/pull step, and the test run.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Docker container
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"
          # Canonical mapping emitted by docker-compose.yml / install.sh /
          # install.ps1 / the docs: host:container both 8080 (the container now
          # listens on the unprivileged 8080 by default so it runs as any UID).
          docker run -d --name sitrec-smoke \
            -p 8080:8080 \
            -e NO_TERRAIN=true \
            "${IMAGE}"

      - name: Wait for container to respond
        run: |
          echo "Waiting for HTTP 200 from container..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Container is ready (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container failed to respond after 60s"
          docker logs sitrec-smoke
          exit 1

      - name: HTTP smoke tests
        run: |
          BODY=$(curl -sf http://localhost:8080/)

          # Verify the entrypoint referenced the runtime settings script from the
          # HTML. The settings are an external file (sitrec-runtime-env.js) rather
          # than an inline script, so a script-src 'self' policy allows them.
          echo "$BODY" | grep -q '<script src="sitrec-runtime-env.js?v=' \
            && echo "✓ Runtime env script referenced" \
            || { echo "✗ Missing sitrec-runtime-env.js reference in HTML"; exit 1; }

          # Verify that file is served and defines the settings object
          ENV_JS=$(curl -sf http://localhost:8080/sitrec-runtime-env.js) \
            || { echo "✗ sitrec-runtime-env.js not served"; exit 1; }
          echo "$ENV_JS" | grep -q '^window.__SITREC_ENV__={' \
            && echo "✓ Runtime env file defines window.__SITREC_ENV__" \
            || { echo "✗ sitrec-runtime-env.js does not define window.__SITREC_ENV__"; exit 1; }

          # Verify webpack output (script bundles present)
          echo "$BODY" | grep -q '<script' \
            && echo "✓ Script tags present" \
            || { echo "✗ Missing script tags in HTML"; exit 1; }

          echo "All HTTP smoke tests passed"

      - name: PHP dependency smoke test (AWS SDK vendor bundled)
        run: |
          # Guards against the image shipping with no PHP vendor/: every server
          # endpoint that does `require 'vendor/autoload.php'` (S3 uploads, settings,
          # rehost, object, metadata, getsitches, admin) fatals without it, which
          # breaks the S3-backed storage the Docker install recommends. The HTTP and
          # Playwright checks never exercise those endpoints, so assert here that the
          # SDK is present and autoloads inside the running container.
          docker exec sitrec-smoke test -f /var/www/html/sitrecServer/vendor/autoload.php \
            && echo "✓ sitrecServer/vendor/autoload.php present" \
            || { echo "✗ Missing sitrecServer/vendor/ (composer install did not run in the image)"; exit 1; }

          docker exec sitrec-smoke php -r 'require "/var/www/html/sitrecServer/vendor/autoload.php"; exit((class_exists("Aws\\S3\\S3Client") && class_exists("GuzzleHttp\\Client")) ? 0 : 1);' \
            && echo "✓ AWS SDK + Guzzle autoload" \
            || { echo "✗ AWS SDK / Guzzle did not autoload from the image"; exit 1; }

      - name: Legacy port-80 back-compat smoke test
        run: |
          # Older installs (pre-8080) map the host to the container's legacy
          # port 80. When the container runs as root — the default here, since
          # GitHub runners use rootful Docker — the entrypoint also listens on
          # 80 so those mappings keep working. Verify that compat shim so we
          # don't silently break upgrading users.
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          docker run -d --name sitrec-smoke-legacy \
            -p 8081:80 \
            -e NO_TERRAIN=true \
            "${IMAGE}"
          echo "Waiting for HTTP 200 via legacy :80 mapping..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null 2>&1; then
              echo "✓ Legacy 8080:80 mapping still serves (root dual-listen)"
              docker rm -f sitrec-smoke-legacy
              exit 0
            fi
            sleep 2
          done
          echo "::error::Legacy port-80 back-compat mapping failed to respond"
          docker logs sitrec-smoke-legacy
          docker rm -f sitrec-smoke-legacy
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The container security review moved to the per-architecture `package` job, so
      # both published images are reviewed rather than only amd64. See the block there.

      - name: Install dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # MCR rate-limits (toomanyrequests) and occasionally WAF-blocks
      # (unauthorized) GitHub runners' shared egress IPs, and the throttle
      # window can outlast a short retry budget. Cache the image tarball keyed
      # by version so the common path (unchanged Playwright version) never
      # touches MCR; only the first run after a version bump pulls.
      - name: Cache Playwright image
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: /tmp/playwright-image.tar
          key: playwright-image-${{ env.PLAYWRIGHT_IMAGE }}

      - name: Load or pull Playwright image (with retry)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ] && [ -f /tmp/playwright-image.tar ]; then
            echo "Loading Playwright image from cache"
            docker load -i /tmp/playwright-image.tar
            exit 0
          fi
          # Cache miss: pull from MCR with exponential-ish backoff + jitter,
          # then save the tarball so actions/cache persists it for next time.
          for i in $(seq 1 6); do
            if docker pull "$PLAYWRIGHT_IMAGE"; then
              docker save "$PLAYWRIGHT_IMAGE" -o /tmp/playwright-image.tar
              exit 0
            fi
            backoff=$(( i * 20 + (RANDOM % 15) ))
            echo "Pull attempt $i failed, retrying in ${backoff}s..."
            sleep "$backoff"
          done
          echo "All pull attempts failed"
          exit 1

      - name: Run Playwright smoke test
        run: |
          docker run --rm --ipc=host --network=host \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e DOCKER_SMOKE_URL=http://localhost:8080 \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --config=playwright.docker.config.js

      - name: Upload smoke test snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-snapshots
          path: |
            tests_regression/docker-smoke.test.js-snapshots/
            test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker logs sitrec-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f sitrec-smoke || true

  # ── Stage 4: Create multi-arch manifest ─────────────────────────
  manifest:
    needs: [package, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Check if this is the newest version tag
        id: check-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Current tag from the ref (e.g. "2.41.1")
          THIS_TAG="${GITHUB_REF_NAME}"
          echo "This tag: ${THIS_TAG}"

          # Find the highest semver tag in the repo
          NEWEST=$(gh api "repos/${{ github.repository }}/git/refs/tags" \
            --paginate --jq '.[].ref' \
            | sed 's|refs/tags/||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          echo "Newest tag: ${NEWEST}"

          if [ "$THIS_TAG" = "$NEWEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "→ This IS the newest tag, will update 'latest'"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "→ A newer tag exists (${NEWEST}), skipping 'latest'"
          fi

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Index-level annotations show up on the tagged row in GHCR's UI
          # (e.g. the "2.44.7" / "latest" entry). Consumed by imagetools create
          # below — metadata-action emits them in "index:key=value" format.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=semver,pattern={{version}}
            ${{ steps.check-latest.outputs.is_latest == 'true' && 'type=raw,value=latest' || '' }}
          labels: |
            org.opencontainers.image.description=Sitrec (multi-arch)
          annotations: |
            org.opencontainers.image.description=Sitrec (multi-arch)

      - name: Create and push multi-arch manifest
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          SOURCE_AMD64="${REGISTRY}/${IMAGE_NAME_LC}:build-amd64-${GITHUB_SHA}"
          SOURCE_ARM64="${REGISTRY}/${IMAGE_NAME_LC}:build-arm64-${GITHUB_SHA}"

          # Turn each "index:key=value" line from metadata-action into a
          # --annotation flag. Passed via env var (not inline expansion)
          # so values with special characters don't break the shell.
          ANNOTATION_ARGS=()
          while IFS= read -r ann; do
            [ -z "$ann" ] && continue
            ANNOTATION_ARGS+=(--annotation "$ann")
          done <<< "$ANNOTATIONS"

          # Create a manifest for each target tag (e.g. 2.41.1, latest)
          echo '${{ steps.meta.outputs.tags }}' | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest for: $tag"
            docker buildx imagetools create \
              "${ANNOTATION_ARGS[@]}" \
              --tag "${tag}" \
              "${SOURCE_AMD64}" \
              "${SOURCE_ARM64}"
          done

      - name: Clean up per-arch build tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${IMAGE_NAME_LC##*/}"
          for SUFFIX in amd64 arm64; do
            TAG="build-${SUFFIX}-${GITHUB_SHA}"
            echo "Deleting tag: ${TAG}"
            # Find the version ID for this tag
            VID=$(gh api "/user/packages/container/${PKG}/versions" \
              --paginate --jq ".[] | select(.metadata.container.tags[] == \"${TAG}\") | .id")
            if [ -n "$VID" ]; then
              gh api --method DELETE "/user/packages/container/${PKG}/versions/${VID}"
              echo "Deleted version ${VID} (${TAG})"
            else
              echo "Warning: could not find version for tag ${TAG}"
            fi
          done
