# the workflow syntax is described at:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: CI

on:   # when this workflow should be triggered
  push:
    branches:
      - '**'           # run on all branch pushes
  pull_request:
  workflow_dispatch:    # allows triggering a more exhaustive battery of tests manually

defaults:
  run:
    shell: bash    # scripts should use bash on all OS-es 

jobs:
  build_web:
    if: true  # the job can be disabled from here
    permissions:
      contents: read
    strategy:
      matrix:   # run a separate jub for all combinations of the following variables
        node-version: [22.4]
        # Ubuntu by default; all three on a manual run.
        #
        # This was pinned to macOS because the suite failed on Linux. The cause was one
        # character: a test read "input/" where the directory is "Input/", which resolves
        # on a case-insensitive filesystem and not on a case-sensitive one. That was fixed,
        # and a workflow_dispatch run on 2026-09-03 confirmed ubuntu-latest green.
        #
        # Ubuntu is the better default for two reasons beyond cost. Development happens on
        # macOS, so a macOS-only CI tested nothing that was not already being tested; and
        # every CI runner and the production container are case-sensitive, so Linux is the
        # platform that catches the class of bug that pin was hiding — three instances of
        # it surfaced on the day this changed. macOS is also ten times the price per minute,
        # which matters on a public repository only as a courtesy, but the coverage argument
        # stands on its own.
        os: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["ubuntu-latest"]' ||
          '["ubuntu-latest","windows-latest","macos-latest"]') }}
      fail-fast: false   # don't stop all of the jobs when one of them fails
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        # No job here pushes with the checkout token.
        persist-credentials: false
        # webpack.common.js uses 'git describe --tags --abbrev=0' to get the latest tag
        # but checkout only does a shallow clone by default and the tags are not available
        # fetch-tags: true is supposed to fetch the tags without a full clone, but doesn't work ?
        fetch-depth: 0    # do a full clone instead. for now it doesn't seem to be any slower
    - name: use node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        # cache the downloaded node version and the package dependencies
        # it doesn't seem to make it faster for now, disabled
        #cache: npm
        #cache-dependency-path: package-lock.json
    - name: config script setup
      run: |
        cp config/config.js.example config/config.js
        cp config/config-install.js.example config/config-install.js
        cp config/shared.env.example config/shared.env
        cp config/config.php.example config/config.php
        mkdir ../dev ../prod
        # webpack's schema requires absolute paths for the output paths
        # macOS uses BSD sed instead of GNU sed on linux/windows. this works for both:
        sed -i'.bak' -e "s#dev_path:.*#dev_path: '$(realpath ../dev)',#" config/config-install.js
        sed -i'.bak' -e "s#prod_path:.*#prod_path: '$(realpath ../prod)',#" config/config-install.js
        cat config/config-install.js
    - name: install deps
      # could use npm ci instead, but this is more consistent with the build instructions in the README
      run: npm install
    - name: build dev
      run: npm run build
      if: github.event_name != 'push'
    - name: build prod
      run: npm run deploy
    # Runs before the tests because it takes about a tenth of a second against 675
    # files, so a genuine undeclared-variable error is reported in seconds rather
    # than after the suite. Verified passing on the tree at the time it was added.
    - name: lint
      run: npm run lint
    - name: run tests
      run: npm test

  partition_lint:
    # Static partition-neutrality checks for the hardened AWS deployment
    # (deploy/aws/lint/README.md): no commercial-partition ARN prefixes, region
    # or endpoint literals, or resource types an isolated partition lacks.
    # Plain Node with no dependencies, so there is nothing to install.
    if: true  # the job can be disabled from here
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # No job here pushes with the checkout token.
        persist-credentials: false
    - name: use node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22.4
    - name: partition lint
      run: npm run lint-partition

  # playwright:
  #   # DISABLED: Playwright tests are unreliable in GitHub CI.
  #   # Run locally with: npm run test-ui
  #   if: false
      
  build_console:
    # MICK: this job is disabled as console mode is no longer supported
    if: false  # the job can be disabled from here
    permissions:
      contents: read
    strategy:
      matrix:   # run a separate jub for all combinations of the following variables
        # it should typically be enough to run the console tests on macOS
        # but allow them to run on three platforms if the workflow is triggered manually
        os: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["macos-latest"]' ||
          '["ubuntu-latest","windows-latest","macos-latest"]') }}
      fail-fast: false   # don't stop all of the jobs when one of them fails
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        # No job here pushes with the checkout token.
        persist-credentials: false
    - name: install bun
      uses: oven-sh/setup-bun@v2
    - name: install deps
      run: bun install --production # a bit faster than npm i/ci, except on windows
      # (Mick) changed back to npm ci, bun install has issues with frozen lockfile errors
      # run: npm ci --production
    - name: config script setup
      run: |
        cp config/config.js.example config/config.js
        # custom console tools will often be run from outside the source tree
        # so by default the config assumes that sitrec's root is "./sitrec/"
        mv ./test/console/*.js ../
        # note: by default, without remapping imports, bun uses the three.js version from package-lock.json 
    - name: run console test
      run: cd ../ && for i in ./*.js; do bun $i; done
    - name: run tests
      # jsdom does not work with bun, so skip tests whose name contains 'jsdom'
      run: cd tests && bun test -t "^((?!jsdom).)*$"
